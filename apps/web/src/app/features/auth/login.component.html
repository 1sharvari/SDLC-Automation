<div class="login-container" data-testid="login-container">
  <div class="login-card" data-testid="login-card">
    <h1 class="title" data-testid="login-title">Sign In</h1>
    <p class="subtitle">Enter your credentials to access your account</p>

    @if (errorMessage()) {
      <div class="alert error" data-testid="login-error-message" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" data-testid="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter username"
          data-testid="username-input"
          [class.invalid]="isFieldInvalid('username')"
        />
        @if (isFieldInvalid('username')) {
          <span class="field-error" data-testid="username-error">
            Username is required
          </span>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter password"
          data-testid="password-input"
          [class.invalid]="isFieldInvalid('password')"
        />
        @if (isFieldInvalid('password')) {
          <span class="field-error" data-testid="password-error">
            Password is required
          </span>
        }
      </div>

      <button
        type="submit"
        class="btn-submit"
        data-testid="login-submit-button"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
